<!DOCTYPE html>
<html lang="en" class="bg-slate-950">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="FnO Zones" />
  <title>1D F&amp;O Demand &amp; Supply Scanner</title>
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" href="/icon-192.png" type="image/png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lightweight-charts@4.1.3/dist/lightweight-charts.standalone.production.js"></script>
  <style>
    html, body { background: #0b1220; overscroll-behavior-y: contain; -webkit-tap-highlight-color: transparent; }
    .safe-top { padding-top: env(safe-area-inset-top, 0px); }
    .safe-bottom { padding-bottom: env(safe-area-inset-bottom, 0px); }
    .pulse-dot { animation: pulse 1.4s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .25; } }
    .flash { animation: flash 1.6s ease-out 1; }
    @keyframes flash { 0% { box-shadow: 0 0 0 2px #facc15; } 100% { box-shadow: 0 0 0 0 transparent; } }
  </style>
</head>
<body class="text-slate-100 min-h-screen font-sans antialiased">

  <!-- Status bar -->
  <header class="sticky top-0 z-30 bg-slate-950/95 backdrop-blur border-b border-slate-800 safe-top">
    <div class="px-3 py-2 grid grid-cols-2 gap-x-3 gap-y-1 text-xs">
      <div class="flex items-center gap-1.5">
        <span class="text-slate-400">Angel One:</span>
        <span id="st-angel" class="font-semibold text-amber-400">--</span>
      </div>
      <div class="flex items-center gap-1.5">
        <span class="text-slate-400">Market:</span>
        <span id="st-market" class="font-semibold text-slate-300">--</span>
      </div>
      <div class="flex items-center gap-1.5">
        <span class="text-slate-400">Last Scan:</span>
        <span id="st-scan" class="font-mono font-semibold text-slate-200">--:--:--</span>
      </div>
      <div class="flex items-center gap-1.5">
        <span class="text-slate-400">Active Touches:</span>
        <span id="st-active" class="font-semibold text-yellow-300">0</span>
      </div>
    </div>
    <div id="refresh-bar" class="hidden px-3 pb-2 text-xs text-sky-300">
      Refreshing 1D zones… <span id="refresh-progress" class="font-mono"></span>
    </div>
  </header>

  <main class="px-3 pt-3 pb-24 max-w-2xl mx-auto">

    <!-- Actions -->
    <div class="grid grid-cols-2 gap-2">
      <button id="btn-test" class="rounded-xl bg-indigo-600 active:bg-indigo-700 py-3 text-sm font-semibold">
        ▶ Test Live Scan Now
      </button>
      <button id="btn-refresh" class="rounded-xl bg-slate-800 active:bg-slate-700 py-3 text-sm font-semibold border border-slate-700">
        ⟳ Refresh 1D Zones
      </button>
      <button id="btn-sound" class="rounded-xl bg-slate-900 active:bg-slate-800 py-2.5 text-xs font-medium border border-slate-800">
        🔇 Sound: OFF
      </button>
      <button id="btn-notif" class="rounded-xl bg-slate-900 active:bg-slate-800 py-2.5 text-xs font-medium border border-slate-800">
        🔕 Alerts: OFF
      </button>
    </div>
    <button id="btn-install" class="hidden mt-2 w-full rounded-xl bg-emerald-700 py-2.5 text-sm font-semibold">
      📲 Install App
    </button>

    <!-- Zone summary -->
    <p id="zone-summary" class="mt-3 text-[11px] text-slate-500"></p>

    <!-- Test banner -->
    <div id="test-banner" class="hidden mt-3 rounded-xl border border-indigo-500/40 bg-indigo-950/50 p-3 text-xs text-indigo-200">
      <div class="font-semibold">TEST MODE — latest closing data</div>
      <div id="test-msg" class="mt-0.5 text-indigo-300/80"></div>
      <button id="btn-exit-test" class="mt-2 rounded-lg bg-indigo-700 px-3 py-1.5 font-semibold">Back to Live</button>
    </div>

    <!-- Filter tabs -->
    <div class="mt-3 flex gap-2 text-xs">
      <button data-filter="ALL" class="tab flex-1 rounded-lg py-2 font-semibold">All</button>
      <button data-filter="DEMAND" class="tab flex-1 rounded-lg py-2 font-semibold">1D Demand</button>
      <button data-filter="SUPPLY" class="tab flex-1 rounded-lg py-2 font-semibold">1D Supply</button>
    </div>

    <!-- Cards -->
    <section id="cards" class="mt-3 space-y-3"></section>
    <p id="empty" class="hidden text-center text-sm text-slate-500 py-14 leading-relaxed"></p>
  </main>

  <!-- Chart modal -->
  <div id="chart-modal" class="hidden fixed inset-0 z-50 bg-slate-950 flex flex-col">
    <div class="safe-top bg-slate-950 border-b border-slate-800">
      <div class="flex items-center justify-between px-3 py-2">
        <div class="min-w-0">
          <div id="chart-title" class="text-base font-bold truncate"></div>
          <div id="chart-sub" class="text-[11px] text-slate-400 truncate"></div>
        </div>
        <button id="chart-close" class="ml-3 rounded-lg bg-slate-800 px-4 py-2 text-sm font-semibold">✕ Close</button>
      </div>
    </div>
    <div id="chart" class="flex-1 min-h-0"></div>
    <div id="chart-legend" class="safe-bottom px-3 py-2 text-xs border-t border-slate-800 bg-slate-950"></div>
  </div>

  <div id="toast" class="hidden fixed left-1/2 -translate-x-1/2 bottom-6 z-[60] max-w-[90%] rounded-xl bg-slate-800 border border-slate-600 px-4 py-2 text-sm shadow-xl"></div>

  <script src="/static/app.js"></script>
</body>
</html>
