<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NSE F&O Scanner</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;font-family:sans-serif}
    body{background:#0b0f17;color:#e5e7eb;overflow-x:hidden}
    .top{background:#111827;padding:12px 14px 8px;border-bottom:1px solid #1f2937;position:sticky;top:0;z-index:20}
    .row{display:flex;justify-content:space-between;font-size:12px;color:#9ca3af;margin-bottom:6px}
    .ok{color:#10b981}.warn{color:#f59e0b}
    .tabs{display:flex;background:#111827;border-bottom:1px solid #1f2937}
    .tab{flex:1;text-align:center;padding:10px 4px;font-size:13px;font-weight:700;color:#9ca3af;border-bottom:3px solid transparent}
    .tab.on{color:#60a5fa;border-bottom-color:#3b82f6}
    .bdg{background:#1f2937;color:#fff;padding:1px 6px;border-radius:10px;font-size:11px}
    .wrap{display:flex;width:200vw;transition:transform .25s ease}
    .pg{width:100vw;min-height:85vh;padding:12px 14px 40px}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
    button{border:none;border-radius:10px;padding:10px;font-size:13px;font-weight:700;cursor:pointer}
    .b1{background:#2563eb;color:#fff}.b2{background:#1f2937;color:#e5e7eb;border:1px solid #374151}
    .bt{background:#1f2937;color:#f87171;border:1px solid #374151;font-size:12px;padding:8px}.bt.on{color:#34d399;border-color:#059669}
    .meta{font-size:11px;color:#9ca3af;margin-bottom:10px}
    .pills{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px}
    .pill{flex:1;text-align:center;padding:8px 10px;border-radius:10px;background:#1f2937;color:#9ca3af;font-size:12px;font-weight:700}
    .pill.on{background:#f3f4f6;color:#111827}
    .card{background:#111827;border:1px solid #1f2937;border-radius:12px;padding:13px;margin-bottom:10px}
    .ctop{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
    .sym{font-size:17px;font-weight:800;color:#fff}
    .td{background:rgba(16,185,129,.18);color:#34d399;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700}
    .ts{background:rgba(239,68,68,.18);color:#f87171;padding:3px 8px;border-radius:6px;font-size:11px;font-weight:700}
    .cmid{display:flex;justify-content:space-between;font-size:13px;color:#d1d5db;margin-bottom:5px}
    .empty{text-align:center;color:#9ca3af;font-size:13px;padding:30px 15px}
    .modal{display:none;position:fixed;inset:0;background:#0b0f17;z-index:99;flex-direction:column}.modal.on{display:flex}
    .mhdr{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:#111827;border-bottom:1px solid #1f2937}
    .ibar{display:none;padding:6px 12px;background:#172033;font-size:12px;font-weight:700}
    .indb{display:flex;gap:6px;padding:6px 12px;background:#0f172a;border-bottom:1px solid #1f2937}
    .ibtn{padding:4px 9px;font-size:11px;border-radius:6px;background:#1f2937;color:#9ca3af}.ibtn.on{background:#2563eb;color:#fff}
    #cvs{flex:1;width:100vw;display:block;touch-action:none}
  </style>
</head>
<body>
  <div class="top">
    <div class="row"><div>Angel One: <b id="ag" class="warn">Checking...</b></div><div>Market: <b id="mk">--</b></div></div>
    <div class="row" style="margin:0"><div>Last Scan: <b id="ls">--:--:--</b></div><div>1D: <b id="tc">0</b> | Inst: <b id="ic">0</b></div></div>
    <div id="rb" style="font-size:11px;color:#60a5fa;display:none;margin-top:4px"></div>
  </div>
  <div class="tabs">
    <div class="tab on" id="t0" onclick="go(0)">1D Demand & Supply <span class="bdg" id="b0">0</span></div>
    <div class="tab" id="t1" onclick="go(1)">🔥 Inst. Orders <span class="bdg" id="b1">0</span></div>
  </div>
  <div class="wrap" id="wp">
    <div class="pg">
      <div class="grid2"><button class="b1" onclick="scan()">▶ Test Live Scan Now</button><button class="b2" onclick="ref()">↻ Refresh Zones</button></div>
      <div class="grid2"><button class="bt" id="sb" onclick="togS()">🔇 Sound: OFF</button><button class="bt" id="ab" onclick="togA()">🔕 Alerts: OFF</button></div>
      <div class="meta" id="mt">Loading zones...</div>
      <div class="pills"><div class="pill on" onclick="sf1('ALL',this)">All</div><div class="pill" onclick="sf1('DEMAND',this)">1D Demand</div><div class="pill" onclick="sf1('SUPPLY',this)">1D Supply</div></div>
      <div id="l1"></div>
    </div>
    <div class="pg">
      <div class="pills"><div class="pill on" onclick="stf('ALL',this)">All TF</div><div class="pill" onclick="stf('5m',this)">5m</div><div class="pill" onclick="stf('15m',this)">15m</div><div class="pill" onclick="stf('1H',this)">1H</div><div class="pill" onclick="stf('1D',this)">1D</div><div class="pill" onclick="stf('1W',this)">1W</div></div>
      <div class="pills"><div class="pill on" onclick="ssd('ALL',this)">All</div><div class="pill" onclick="ssd('INST_BUYING',this)">🟢 Inst. Buy</div><div class="pill" onclick="ssd('INST_SELLING',this)">🔴 Inst. Sell</div></div>
      <div id="l2"></div>
    </div>
  </div>
  <div class="modal" id="md">
    <div class="mhdr"><div><b id="m1" style="font-size:15px">--</b><div id="m2" style="font-size:11px;color:#9ca3af">--</div></div><div style="display:flex;gap:6px"><button class="b2" style="padding:6px 10px" onclick="zm(-8)">＋</button><button class="b2" style="padding:6px 10px" onclick="zm(8)">－</button><button class="b2" style="padding:6px 10px" onclick="cls()">✕</button></div></div>
    <div class="ibar" id="ib"></div>
    <div class="indb"><button class="ibtn on" onclick="ti('e20',this)">EMA 20</button><button class="ibtn on" onclick="ti('e50',this)">EMA 50</button><button class="ibtn on" onclick="ti('vol',this)">Volume</button></div>
    <canvas id="cvs"></canvas>
  </div>
  <script>
    if("serviceWorker"in navigator){navigator.serviceWorker.getRegistrations().then(r=>r.forEach(x=>x.unregister()));}
    let pg=0,f1="ALL",ft="ALL",fs="ALL",sn=false,al=false,st=null,sx=0,sy=0,seen=new Set(),cd=[],cm=null,vc=40,po=0,dx0=0,pd0=0,ind={e20:true,e50:true,vol:true};
    const wp=document.getElementById("wp"),cv=document.getElementById("cvs"),cx=cv.getContext("2d");
    document.addEventListener("touchstart",e=>{if(!document.getElementById("md").classList.contains("on")){sx=e.changedTouches.item(0).screenX;sy=e.changedTouches.item(0).screenY;}},{passive:true});
    document.addEventListener("touchend",e=>{if(document.getElementById("md").classList.contains("on"))return;const dx=e.changedTouches.item(0).screenX-sx,dy=e.changedTouches.item(0).screenY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4){if(dx<0&&pg===0)go(1);if(dx>0&&pg===1)go(0);}},{passive:true});
    cv.addEventListener("touchstart",e=>{if(e.touches.length===1)dx0=e.touches.item(0).clientX;else if(e.touches.length===2)pd0=Math.hypot(e.touches.item(0).clientX-e.touches.item(1).clientX,e.touches.item(0).clientY-e.touches.item(1).clientY);},{passive:true});
    cv.addEventListener("touchmove",e=>{if(!cd.length)return;if(e.touches.length===1){const x=e.touches.item(0).clientX,sh=Math.round((x-dx0)/Math.max(4,(cv.clientWidth-60)/vc));if(sh!==0){po=Math.max(0,Math.min(Math.max(0,cd.length-vc),po+sh));dx0=x;drw();}}else if(e.touches.length===2){const d=Math.hypot(e.touches.item(0).clientX-e.touches.item(1).clientX,e.touches.item(0).clientY-e.touches.item(1).clientY);if(Math.abs(d-pd0)>12){zm(d>pd0?-4:4);pd0=d;}}},{passive:true});
    function go(i){pg=i;wp.style.transform=`translateX(-${i*100}vw)`;document.getElementById("t0").classList.toggle("on",i===0);document.getElementById("t1").classList.toggle("on",i===1);}
    function act(el){el.parentElement.querySelectorAll(".pill").forEach(p=>p.classList.remove("on"));el.classList.add("on");}
    function sf1(v,el){f1=v;act(el);rnd();}function stf(v,el){ft=v;act(el);rnd();}function ssd(v,el){fs=v;act(el);rnd();}
    function ti(k,el){ind[k]=!ind[k];el.classList.toggle("on",ind[k]);drw();}
    function zm(d){if(!cd.length)return;vc=Math.max(12,Math.min(cd.length,vc+d));po=Math.min(po,Math.max(0,cd.length-vc));drw();}
    function beep(){try{const c=new(window.AudioContext||window.webkitAudioContext)(),o=c.createOscillator(),g=c.createGain();o.frequency.value=950;g.gain.value=0.25;o.connect(g);g.connect(c.destination);o.start();setTimeout(()=>{o.stop();c.close();},280);}catch(e){}}
    function togS(){sn=!sn;if(sn)beep();const b=document.getElementById("sb");b.textContent=sn?"🔊 Sound: ON":"🔇 Sound: OFF";b.classList.toggle("on",sn);}
    function togA(){al=!al;if(al&&"Notification"in window)Notification.requestPermission();const b=document.getElementById("ab");b.textContent=al?"🔔 Alerts: ON":"🔕 Alerts: OFF";b.classList.toggle("on",al);}
    async function scan(){await fetch("/api/scan",{method:"POST"});load();}
    async function ref(){await fetch("/api/refresh",{method:"POST"});load();}
    function cls(){document.getElementById("md").classList.remove("on");}
    function ema(a,p){if(!a.length)return[];const k=2/(p+1),o=[];let v=a.at(0).c;a.forEach((c,i)=>{v=i===0?c.c:(c.c*k+v*(1-k));o.push(v);});return o;}
    async function opn(sym,tf,zt,zl,zh,ltp,ex,ib){
      document.getElementById("m1").textContent=`${sym} (${tf}) • ₹${ltp}`;document.getElementById("m2").textContent=`${zt} Zone: ₹${zl} – ₹${zh} • ${ex}`;
      const b=document.getElementById("ib");if(ib){b.style.display="block";b.textContent=ib;b.style.color=ib.includes("BUYING")?"#34d399":"#f87171";}else b.style.display="none";
      document.getElementById("md").classList.add("on");cd=[];cm={zt,zl:+zl,zh:+zh,ltp:+ltp};po=0;vc=42;
      const h=window.innerHeight-90-(ib?28:0);cv.width=window.innerWidth;cv.height=h;
      cx.fillStyle="#0b0f17";cx.fillRect(0,0,cv.width,h);cx.fillStyle="#9ca3af";cx.font="14px sans-serif";cx.fillText("Loading chart...",40,120);
      try{const r=await fetch(`/api/chart/${encodeURIComponent(sym)}?tf=${encodeURIComponent(tf)}`),d=await r.json();cd=d.candles||[];vc=Math.min(42,cd.length||42);drw();}catch(e){cx.fillText("Chart error",40,120);}
    }
    function drw(){
      const w=cv.width,h=cv.height;cx.fillStyle="#0b0f17";cx.fillRect(0,0,w,h);
      if(!cd.length||!cm){cx.fillStyle="#9ca3af";cx.fillText("No candles right now",60,120);return;}
      const e2=ema(cd,20),e5=ema(cd,50),ed=cd.length-po,bg=Math.max(0,ed-vc),sl=cd.slice(bg,ed),s2=e2.slice(bg,ed),s5=e5.slice(bg,ed);
      const pL=10,pR=58,pT=20,pB=24,cw=w-pL-pR,ch=h-pT-pB;
      let mn=Math.min(cm.zl,cm.ltp,...sl.map(c=>c.l)),mx=Math.max(cm.zh,cm.ltp,...sl.map(c=>c.h)),pd=(mx-mn)*0.08||1;mn-=pd;mx+=pd;
      const y=p=>pT+((mx-p)/(mx-mn))*ch;
      cx.strokeStyle="#1f2937";for(let g=0;g<=4;g++){const gy=pT+(ch*g)/4;cx.beginPath();cx.moveTo(pL,gy);cx.lineTo(pL+cw,gy);cx.stroke();}
      const yt=y(cm.zh),yb=y(cm.zl),isD=cm.zt==="DEMAND";
      cx.fillStyle=isD?"rgba(16,185,129,.24)":"rgba(239,68,68,.24)";cx.fillRect(pL,yt,cw,Math.max(6,yb-yt));
      cx.strokeStyle=isD?"#10b981":"#ef4444";cx.strokeRect(pL,yt,cw,Math.max(6,yb-yt));
      cx.fillStyle=isD?"#34d399":"#f87171";cx.font="bold 11px sans-serif";cx.fillText(`${cm.zt} ZONE`,pL+6,Math.max(pT+12,yt-4));
      const sp=cw/sl.length,bw=Math.max(3,sp*0.64),mv=Math.max(1,...sl.map(c=>c.v||0));
      sl.forEach((c,i)=>{const x=pL+i*sp+sp/2,up=c.c>=c.o;if(ind.vol&&(c.v||0)>0){const vh=((c.v||0)/mv)*(ch*0.2);cx.fillStyle=up?"rgba(16,185,129,.22)":"rgba(239,68,68,.22)";cx.fillRect(x-bw/2,pT+ch-vh,bw,vh);}cx.strokeStyle=up?"#10b981":"#ef4444";cx.fillStyle=up?"#10b981":"#ef4444";cx.beginPath();cx.moveTo(x,y(c.h));cx.lineTo(x,y(c.l));cx.stroke();const tb=y(Math.max(c.o,c.c)),bb=y(Math.min(c.o,c.c));cx.fillRect(x-bw/2,tb,bw,Math.max(1.5,bb-tb));});
      if(ind.e20){cx.strokeStyle="#f59e0b";cx.beginPath();s2.forEach((v,i)=>{const x=pL+i*sp+sp/2;i===0?cx.moveTo(x,y(v)):cx.lineTo(x,y(v));});cx.stroke();}
      if(ind.e50){cx.strokeStyle="#a855f7";cx.beginPath();s5.forEach((v,i)=>{const x=pL+i*sp+sp/2;i===0?cx.moveTo(x,y(v)):cx.lineTo(x,y(v));});cx.stroke();}
      const yl=y(cm.ltp);cx.strokeStyle="#60a5fa";cx.beginPath();cx.moveTo(pL,yl);cx.lineTo(pL+cw,yl);cx.stroke();
      cx.font="11px sans-serif";[mx,cm.zh,cm.zl,mn].forEach(p=>{cx.fillStyle="#9ca3af";cx.fillText(p.toFixed(1),pL+cw+4,y(p)+4);});
      cx.fillStyle="#2563eb";cx.fillRect(pL+cw+2,yl-9,pR-4,18);cx.fillStyle="#fff";cx.fillText(cm.ltp.toFixed(1),pL+cw+4,yl+4);
    }
    function rnd(){
      if(!st)return;
      const a=document.getElementById("ag");a.textContent=st.angel_connected?"Connected":"Fallback";a.className=st.angel_connected?"ok":"warn";
      const m=document.getElementById("mk");m.textContent=st.market_open?"OPEN":"CLOSED";m.style.color=st.market_open?"#10b981":"#f87171";
      document.getElementById("ls").textContent=st.last_scan||"--:--:--";
      const t1=st.touches||[],ins=st.institutional||[];
      let nw=false;t1.forEach(t=>{const k=`${t.symbol}:${t.zone_type}`;if(!seen.has(k)){seen.add(k);nw=true;if(al&&"Notification"in window&&Notification.permission==="granted")new Notification(`🚨 1D ${t.zone_type}: ${t.symbol} @ ₹${t.ltp}`);}});if(nw&&sn)beep();
      document.getElementById("tc").textContent=t1.length;document.getElementById("ic").textContent=ins.length;document.getElementById("b0").textContent=t1.length;document.getElementById("b1").textContent=ins.length;
      const rb=document.getElementById("rb");rb.style.display=st.is_refreshing?"block":"none";if(st.is_refreshing)rb.textContent=`Refreshing... ${st.refresh_progress}`;
      document.getElementById("mt").textContent=`${st.total_zones_1d} 1D zones (${st.demand_zones_1d} demand / ${st.supply_zones_1d} supply) • tap card for chart`;
      const l1=document.getElementById("l1"),fl1=t1.filter(t=>f1==="ALL"||t.zone_type===f1);
      l1.innerHTML=!fl1.length?`<div class="empty">${st.market_open?"Scanning live prices...":'Market closed. Tap "Test Live Scan Now".'}</div>`:fl1.map(t=>{const fp=t.institutional||{};const ib=fp.is_institutional?`${fp.inst_side==="INST_BUYING"?"🔥 INST. BUYING":"🔥 INST. SELLING"} • Vol ${fp.vol_ratio}x`:"";return `<div class="card" onclick="opn('${t.symbol}','1D','${t.zone_type}',${t.zone_low},${t.zone_high},${t.ltp},'Strength ${t.strength}%','${ib}')"><div class="ctop"><span class="sym">${t.symbol} 📊</span><span class="${t.zone_type==="DEMAND"?"td":"ts"}">1D ${t.zone_type}</span></div><div class="cmid"><span>LTP: <b>₹${t.ltp}</b></span><span>Zone: <b>₹${t.zone_low} – ₹${t.zone_high}</b></span></div><div class="meta" style="margin:0">Origin: ${t.origin_ts} • Strength: ${t.strength}%</div></div>`;}).join("");
      const l2=document.getElementById("l2"),fl2=ins.filter(x=>(ft==="ALL"||x.timeframe===ft)&&(fs==="ALL"||x.inst_side===fs));
      l2.innerHTML=!fl2.length?`<div class="empty">No institutional orders for filter right now.</div>`:fl2.map(x=>{const ib=x.inst_side==="INST_BUYING",bn=`${ib?"🔥 INST. BUYING":"🔥 INST. SELLING"} • Vol ${x.vol_ratio}x • Score ${x.inst_score}%`;return `<div class="card" style="border-left:4px solid ${ib?"#10b981":"#ef4444"}" onclick="opn('${x.symbol}','${x.timeframe}','${x.zone_type}',${x.zone_low},${x.zone_high},${x.ltp},'Vol ${x.vol_ratio}x','${bn}')"><div class="ctop"><span class="sym">[${x.timeframe}] ${x.symbol} 📊</span><span class="${ib?"td":"ts"}">${ib?"🔥 INST. BUY":"🔥 INST. SELL"}</span></div><div class="cmid"><span>LTP: <b>₹${x.ltp}</b></span><span>Zone: <b>₹${x.zone_low} – ₹${x.zone_high}</b></span></div><div class="meta" style="margin:0">Vol: ${x.vol_ratio}x • Score: ${x.inst_score}%</div></div>`;}).join("");
    }
    async function load(){try{const r=await fetch("/api/state");if(r.ok){st=await r.json();rnd();}}catch(e){}}
    load();setInterval(load,8000);
  </script>
</body>
</html>
